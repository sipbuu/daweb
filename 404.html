<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>404 • CBHS Minecraft</title>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
        color: #f4f4f5;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        text-align: center;
      }
      p.code {
        margin: 0 0 12px;
        color: #d4b45a;
        letter-spacing: 0.18em;
        font-weight: 700;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.4rem);
        letter-spacing: -0.05em;
      }
      p {
        margin: 0 0 24px;
        color: #a1a1aa;
      }
      a {
        display: inline-flex;
        color: #18150c;
        background: #d4b45a;
        text-decoration: none;
        font-weight: 700;
        border-radius: 999px;
        padding: 11px 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p class="code">404</p>
        <h1>Page not found</h1>
        <p>This link does not go anywhere on the CBHS Minecraft site.</p>
        <a href="/">Back home</a>
      </div>
    </main>
  </body>
</html>
